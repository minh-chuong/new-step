<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Portfolio | Your Name</title>
    <meta name="title" content="Portfolio | Your Name" />
    <meta
      name="description"
      content="Product designer and developer crafting elegant digital experiences with precision and purpose."
    />
    <meta name="author" content="Your Name" />
    <meta name="theme-color" content="#09090b" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourportfolio.com/" />
    <meta property="og:title" content="Portfolio | Your Name" />
    <meta
      property="og:description"
      content="Product designer and developer crafting elegant digital experiences with precision and purpose."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://yourportfolio.com/" />
    <meta property="twitter:title" content="Portfolio | Your Name" />
    <meta
      property="twitter:description"
      content="Product designer and developer crafting elegant digital experiences with precision and purpose."
    />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://yourportfolio.com/" />

    <!-- Preconnect to fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
